<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/_reset.css">
        <link rel="stylesheet" href="css/_root.css">
        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/console.css">
    </head>
    <body>
        <script src="./lib/jquery-3.7.1.min.js"></script>
        <script src="./js/web.console.command/Command.js"></script>
        <script src="./js/WebLoger.js"></script>

        <!-- Header -->
        <div class="header">
            <div class="logo">
                <p class="logo-cristall-app">Cristall.<span class="logo-red-app">console</span></p>
            </div>
            <div class="control-island-frame">
                <button class="control-island-button" data-channel="console:minimize">
                    <div class="minus-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 18 18" fill="none">
                            <path d="M4.5 9H13.5" stroke="#999999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </button>
                <button class="control-island-button" data-channel="console:maximize">
                    <div class="stop-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16" fill="none">
                            <path d="M6.2 14H9.8C12.8 14 14 12.8 14 9.8V6.2C14 3.2 12.8 2 9.8 2H6.2C3.2 2 2 3.2 2 6.2V9.8C2 12.8 3.2 14 6.2 14Z" stroke="#999999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </button>
                <button class="control-island-button" data-channel="console:close">
                    <div class="add-icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34" fill="none">
                            <path d="M12.7573 21.2426L21.2426 12.7574" stroke="#999999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M21.2426 21.2426L12.7573 12.7574" stroke="#999999" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                </button>
            </div>
        </div>
        <div class="console-messages-frame">
            
        </div>
        <div class="console-input-frame">
            <input class="console-input" placeholder="Command...">
            <button class="console-button" control-id="refresh">
                <svg width="30" height="30" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M22.3351 7.6201C21.0301 7.2301 19.5901 6.9751 18.0001 6.9751C10.8151 6.9751 4.99512 12.7951 4.99512 19.9801C4.99512 27.1801 10.8151 33.0001 18.0001 33.0001C25.1851 33.0001 31.0051 27.1801 31.0051 19.9951C31.0051 17.3251 30.1951 14.8351 28.8151 12.7651" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M24.1949 7.98L19.8599 3" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M24.1951 7.97998L19.1401 11.67" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>                        
            </button>
            <button class="console-button" control-id="execute">
                <svg width="30" height="30" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M11.1 9.47999L23.835 5.23499C29.55 3.32999 32.655 6.44999 30.765 12.165L26.52 24.9C23.67 33.465 18.99 33.465 16.14 24.9L14.88 21.12L11.1 19.86C2.53502 17.01 2.53502 12.345 11.1 9.47999Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M15.165 20.4751L20.535 15.0901" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>                        
            </button>
        </div>

        <script src="./js/console.web.js"></script>
        <script src="./js/commands.web.js"></script>
    </body>
</html>
